<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura funcional do Job Hunter</title><desc id="desc">Cloud Scheduler aciona Cloud Run Job. Fontes de vagas alimentam o Job que normaliza, deduplica, classifica, persiste no Firestore e envia alertas para Telegram e email. API e painel consultam o Firestore. SQLite é utilizado apenas em desenvolvimento e testes locais.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#38bdf8"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.h{font-size:28px;fill:#f1f5f9;font-weight:700}.sub{font-size:15px;fill:#94a3b8}.label{font-size:20px;fill:#f8fafc;font-weight:700}.small{font-size:14px;fill:#cbd5e1}.node{fill:#14243c;stroke:#4c7593;stroke-width:2}.line{stroke:#38bdf8;stroke-width:3;fill:none;marker-end:url(#arrow)}.line2{stroke:#38bdf8;stroke-width:3;fill:none}</style></defs>
<rect width="1200" height="620" rx="22" fill="#0b1729"/>
<text x="54" y="58" class="h">JOB HUNTER  |  ARQUITETURA FUNCIONAL</text><text x="55" y="88" class="sub">Estudo de caso público • visão lógica, sem recursos ou identificadores de produção</text>
<rect x="42" y="150" width="228" height="110" rx="14" class="node"/><text x="156" y="194" text-anchor="middle" class="label">Fontes de vagas</text><text x="156" y="220" text-anchor="middle" class="small">Coletores por plataforma</text>
<rect x="42" y="342" width="228" height="105" rx="14" class="node"/><text x="156" y="387" text-anchor="middle" class="label">Cloud Scheduler</text><text x="156" y="413" text-anchor="middle" class="small">Agendamento</text>
<rect x="366" y="214" width="310" height="192" rx="16" fill="#153450" stroke="#38bdf8" stroke-width="3"/><text x="521" y="260" text-anchor="middle" class="label">Cloud Run Job</text><text x="521" y="294" text-anchor="middle" class="small">Python • contêiner</text><text x="521" y="322" text-anchor="middle" class="small">Coleta → normalização</text><text x="521" y="348" text-anchor="middle" class="small">Deduplicação → relevância</text><text x="521" y="374" text-anchor="middle" class="small">Persistência e alertas</text>
<rect x="785" y="142" width="330" height="102" rx="14" class="node"/><text x="950" y="188" text-anchor="middle" class="label">Firestore</text><text x="950" y="214" text-anchor="middle" class="small">Vagas e estado de processamento</text>
<rect x="785" y="286" width="330" height="102" rx="14" class="node"/><text x="950" y="332" text-anchor="middle" class="label">Telegram / e-mail</text><text x="950" y="358" text-anchor="middle" class="small">Notificações para revisão humana</text>
<rect x="785" y="430" width="330" height="102" rx="14" class="node"/><text x="950" y="477" text-anchor="middle" class="label">API / Painel</text><text x="950" y="503" text-anchor="middle" class="small">Consulta de vagas e histórico</text>
<path d="M270 206 H320 V280 H366" class="line"/><path d="M270 394 H320 V350 H366" class="line"/><path d="M676 272 H731 V193 H785" class="line"/><path d="M785 223 H751 V297 H676" class="line"/><path d="M676 338 H785" class="line"/><path d="M950 430 V244" class="line"/><path d="M990 244 V430" class="line"/>
<text x="59" y="568" class="small">Desenvolvimento e testes locais: SQLite por interface de repositório (fora do fluxo de produção).</text>
<text x="59" y="592" class="sub">Fluxo simplificado; não representa topologia, permissões, serviços auxiliares nem SLAs.</text>
</svg>